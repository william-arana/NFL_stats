name: Probe CHI captions (one-off)
on:
  push:
    branches: [chi-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-pressers.txt && python -m playwright install --with-deps chromium
      - run: python scripts/probe_chi.py
