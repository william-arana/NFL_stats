name: Deploy Yahoo Worker

# Deploys worker/yahoo (the private "My Yahoo team" page) to Cloudflare.
# Needs repo secrets: CLOUDFLARE_API_TOKEN (Workers edit), YAHOO_CLIENT_ID, YAHOO_CLIENT_SECRET.
on:
  push:
    branches: [main]
    paths: ["worker/yahoo/**", ".github/workflows/deploy-yahoo-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-yahoo-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy + set secrets
        working-directory: worker/yahoo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
        run: |
          npx --yes wrangler@4 deploy
          node -e 'process.stdout.write(JSON.stringify({YAHOO_CLIENT_ID:process.env.YAHOO_CLIENT_ID,YAHOO_CLIENT_SECRET:process.env.YAHOO_CLIENT_SECRET}))' > /tmp/s.json
          npx --yes wrangler@4 secret bulk /tmp/s.json
          rm -f /tmp/s.json
