name: Pressers debug (one video)
on:
  push:
    branches: [pressers-weekly]
    paths: [scripts/debug_captions.py, .github/workflows/pressers-debug.yml]
  workflow_dispatch:
    inputs:
      url:
        description: video page URL
        default: https://www.chicagobears.com/video/ben-johnson-we-have-to-play-the-best-we-ve-played-all-year-on-monday-night-press-conference
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/debug_captions.py "${{ inputs.url || 'https://www.chicagobears.com/video/ben-johnson-we-have-to-play-the-best-we-ve-played-all-year-on-monday-night-press-conference' }}"
