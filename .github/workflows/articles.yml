name: Weekly articles

# The Rundown (articles.html + the "This week" strip on Home), 67FFL.
# Recap Tuesday: starts as soon as a Tuesday data refresh finishes (5:17 AM PT, again 7:17 AM),
# so it's up around 6 AM. Later Tuesday runs (and the 8:41 AM backup) skip if it already exists.
# Preview Thursday after the pre-TNF refresh. Manual runs always (re)write.
# Claude writes the prose from computed facts (secret ANTHROPIC_API_KEY); without it, template text.
# Times are UTC; Pacific (standard time) in comments.
on:
  workflow_run:
    workflows: ["Update data"]
    types: [completed]
  schedule:
    - cron: "41 16 * * 2"   # Tue 8:41 AM PT: backup for the recap (skips if already written)
    - cron: "7 22 * * 4"    # Thu 2:07 PM PT: preview of the coming week
  workflow_dispatch:
    inputs:
      kind:
        description: "recap or preview"
        default: recap
      week:
        description: "week (blank = latest finished week for a recap, next week for a preview)"
        default: ""
      no_llm:
        description: "true = template text only (no Claude call)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  article:
    # after "Update data": only if it succeeded (the Tuesday check is in the Build step)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: Build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          KIND: ${{ inputs.kind }}
          WEEK: ${{ inputs.week }}
          NO_LLM: ${{ inputs.no_llm }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            [ "$SCHED" = "41 16 * * 2" ] && KIND=recap || KIND=preview
          fi
          if [ "$EVENT" = "workflow_run" ]; then
            [ "$(TZ=America/Los_Angeles date +%u)" != 2 ] && echo "Not Tuesday: no recap" && exit 0
            KIND=recap
          fi
          args="--kind ${KIND:-recap}"
          [ "$EVENT" != "workflow_dispatch" ] && args="$args --skip-existing"
          [ -n "$WEEK" ] && args="$args --week $WEEK"
          [ "$NO_LLM" = "true" ] && args="$args --no-llm"
          [ -z "$ANTHROPIC_API_KEY" ] && echo "::warning::ANTHROPIC_API_KEY secret not set: using template text"
          python scripts/build_articles.py $args
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site/articles
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Weekly article: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
