name: Connect Yahoo league

# One-time (or when the connection breaks): paste the code a league member got from Yahoo's "Agree" page.
# The code works once and expires in ~10 minutes. Saves that person's encrypted token to data/private/yahoo_token_<account>.enc,
# then checks access. League data is not saved (Yahoo's personal use agreement).
on:
  workflow_dispatch:
    inputs:
      account:
        description: "Whose Yahoo account (william, westin, ...)"
        required: true
        default: william
      code:
        description: "Code from Yahoo (or the whole localhost address it ends on)"
        required: true

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
    steps:
      - name: Hide the code in logs
        run: echo "::add-mask::${{ inputs.code }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: "Trade the code for a token (first: the code expires fast)"
        env:
          YAHOO_CODE: ${{ inputs.code }}
          YAHOO_ACCOUNT: ${{ inputs.account }}
        run: pip install requests -q && python scripts/yahoo_connect.py
      - run: pip install -r requirements.txt
      # Access check only: nothing from Yahoo is written to the repo (personal use agreement).
      - name: Check Yahoo access (no league data saved)
        id: pull
        continue-on-error: true
        env:
          YAHOO_ACCOUNT: ${{ inputs.account }}
        run: cd scripts && python -c "import os, yahoo_common as y; print('Yahoo access OK, NFL game key', y.nfl_game_key(y.access_token(os.environ['YAHOO_ACCOUNT'])))"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/private
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Connect Yahoo league ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase && git push
          fi
      - name: Report the league pull
        if: steps.pull.outcome == 'failure'
        run: echo "::warning::Token saved, but the access check failed (see the step above). A 403 'not authorized' means Yahoo hasn't turned on access yet." && exit 1
