name: Debug ESPN news sources (temporary)
on:
  push:
    branches: [debug/espn-news]
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[probe result]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 debug/probe.py > debug/result.json
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/result.json && git commit -m "[probe result]" && git push
