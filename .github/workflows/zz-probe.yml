name: zz probe (temporary)
on:
  push:
    branches: [player-cards-trade]
    paths: [".github/workflows/zz-probe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe.txt 2>&1
          python3 - <<'PY'
          import json,urllib.request,datetime
          def get(u):
              r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=20);return json.loads(r.read())
          for u in ["https://api.sleeper.app/players/nfl/421/news","https://api.sleeper.app/players/nfl/421/news?limit=100","https://api.sleeper.app/players/nfl/421/news?limit=500","https://api.sleeper.app/players/nfl/421/news?limit=100&offset=20","https://api.sleeper.app/players/nfl/4984/news?limit=200","https://api.sleeper.app/players/nfl/PIT/news?limit=50","https://api.sleeper.app/players/nfl/421/news?limit=100&before=1780000000000"]:
              try:
                  j=get(u);ts=[x.get("published") for x in j]
                  f=lambda t:datetime.datetime.utcfromtimestamp(t/1000).strftime("%Y-%m-%d") if t else None
                  print(u,"n",len(j),"newest",f(max(ts)) if ts else None,"oldest",f(min(ts)) if ts else None,"sources",sorted(set(x.get("source") for x in j)))
              except Exception as e: print(u,"ERR",e)
          j=get("https://api.sleeper.app/players/nfl/421/news?limit=3")
          print(json.dumps(j,indent=1)[:3000])
          PY
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe.txt; git commit -m "probe output"; git push
